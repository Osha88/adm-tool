<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AdmNexus — Рабочая панель</title>

    <!-- === БЛОК 1: ПОДКЛЮЧЕНИЕ СТИЛЕЙ И БИБЛИОТЕК === -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

    <!-- === БЛОК 2: ШАПКА === -->
    <div class="header">
        <h1>🚀 AdmNexus</h1>
        <div>
            <span class="user-info" id="userInfo">—</span>
            <button id="adminBtn" style="display:none;" onclick="goToAdmin()">🔑 Админ-панель</button>
            <button onclick="doLogout()">Выйти</button>
        </div>
    </div>

    <!-- === БЛОК 3: ВКЛАДКИ === -->
    <div class="tabs">
        <div class="tab active" id="tab-console" onclick="showTab('console')">🖥 Консоль</div>
        <div class="tab" id="tab-map" onclick="showTab('map')">🗺️ Диспетчерская</div>
    </div>

    <!-- === БЛОК 4: ПАНЕЛЬ «КОНСОЛЬ» === -->
    <div class="panel active" id="panel-console">

        <!-- === БЛОК 4.1: Управление === -->
        <div class="controls">
            <select id="deviceSelect">
                <option value="">— Выберите сервер —</option>
            </select>
            <button onclick="switchDevice()">🔌 Подключиться</button>
            <button onclick="openServerModal()">+ Добавить сервер</button>
            <button onclick="deleteCurrentServer()">🗑 Удалить сервер</button>
            <span class="status" id="sshStatus">Статус: не подключено</span>
            <button onclick="toggleMode()" title="Ctrl+Shift+T">🔀 Режим</button>
        </div>

        <!-- === БЛОК 4.2: Макросы === -->
        <div class="macros">
            <button onclick="runMacro('uptime && df -h && free -m\n')">📊 Статус</button>
            <button onclick="runMacro('ip route && ping -c 2 8.8.8.8\n')">🌐 Сеть</button>
            <button onclick="runMacro('ls -la /var/log | tail -10\n')">📁 Логи</button>
            <button class="danger" onclick="runMacro('systemctl restart apache2\n')">🔄 Перезагрузить Apache</button>
            <button onclick="visualizeRoute()" style="color:#00ffff; border-color:#00ffff;">🗺️ Визуализировать маршрут</button>
            <button class="map-btn" onclick="showTab('map')">🗺️ Диспетчерская</button>
        </div>

        <!-- === БЛОК 4.3: КОНСОЛЬ + САЙДБАР === -->
        <div class="console-layout">

            <!-- Терминал -->
            <div class="console-wrapper" id="consoleWrapper">
                <div id="terminal"></div>
                <div class="mode-indicator" id="modeIndicator">Режим: мой терминал</div>
            </div>

            <!-- Сайдбар: Контроль -->
            <div class="sidebar">
                <div class="sidebar-group">
                    <div class="sidebar-title">🎛 Контроль</div>
                    <div class="sidebar-buttons">
                        <button onclick="runMacro('uptime; free -m; df -h\n')">🔥 Нагрузка</button>
                        <button onclick="runMacro('df -h; du -sh /var/log/*\n')">💾 Диски</button>
                        <button onclick="runMacro('curl -I localhost; ping -c 2 8.8.8.8; systemctl status nginx\n')">🌐 Сайт</button>
                        <button onclick="runMacro('ss -tulpn | grep -E \':(21|22|25|53|80|110|143|443|2375|3306|3389|5432|6379|8080|27017)\'\n')">🔍 Порты</button>
                        <button onclick="runMacro('last -10; grep \'Failed password\' /var/log/auth.log | tail -10\n')">🕵 Кто заходил</button>
                        <button onclick="runMacro('journalctl -n 50 --no-pager\n')">📁 Логи</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- === БЛОК 5: ПАНЕЛЬ «ДИСПЕТЧЕРСКАЯ» === -->
    <div class="panel" id="panel-map">
        <div class="controls">
            <button onclick="loadMap()">🔄 Обновить сейчас</button>
            <span class="status" id="mapStatus">Автообновление: раз в 5 минут</span>
        </div>

        <!-- === БЛОК 5.1: КАРТА + ПАНЕЛЬ СЕРВЕРОВ === -->
        <div class="map-layout">

            <!-- Левая панель: все серверы -->
            <div class="server-panel" id="serverPanel">
                <div class="server-panel-empty">Серверов нет</div>
            </div>

            <!-- Карта России + легенда -->
            <div class="map-wrapper">
                <div class="map-container" id="mapContainer">
                    <img src="/static/russia.jpg" class="map-image" alt="Карта России" />
                </div>

                <div class="map-legend">
                    <div class="legend-item"><span class="dot green"></span> ONLINE</div>
                    <div class="legend-item"><span class="dot yellow"></span> WARNING</div>
                    <div class="legend-item"><span class="dot red"></span> OFFLINE</div>
                </div>
            </div>

        </div>
    </div>

    <!-- === БЛОК 6: МОДАЛЬНОЕ ОКНО «ДОБАВИТЬ СЕРВЕР» === -->
    <div class="modal" id="serverModal">
        <div class="modal-content">
            <h3>Добавить сервер</h3>

            <div class="form-group">
                <label>Название</label>
                <input type="text" id="srvName" />
            </div>
            <div class="form-group">
                <label>IP-адрес или домен</label>
                <input type="text" id="srvHost" />
            </div>
            <div class="form-group">
                <label>Порт SSH</label>
                <input type="number" id="srvPort" value="22" />
            </div>
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="srvUser" value="root" />
            </div>

            <div class="auth-switch">
                <button type="button" id="authPasswordBtn" class="active" onclick="setAuthType('password')">🔑 Пароль</button>
                <button type="button" id="authKeyBtn" onclick="setAuthType('key')">🗝️ SSH-ключ</button>
            </div>

            <div class="form-group" id="passwordGroup">
                <label>Пароль SSH</label>
                <input type="password" id="srvPass" />
            </div>

            <div class="form-group hidden" id="keyGroup">
                <label>Приватный ключ (OpenSSH, PEM, PuTTY)</label>
                <textarea id="srvKey" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----"></textarea>
            </div>
            <div class="form-group hidden" id="passphraseGroup">
                <label>Passphrase (если есть)</label>
                <input type="password" id="srvPassphrase" />
            </div>

            <!-- === СТРАНА === -->
            <div class="form-group">
                <label>Страна</label>
                <select id="srvCountry" onchange="onCountryChange()">
                    <option value="Россия">🇷🇺 Россия</option>
                    <option value="Литва">🇱🇹 Литва</option>
                    <option value="Латвия">🇱🇻 Латвия</option>
                    <option value="Эстония">🇪🇪 Эстония</option>
                    <option value="Беларусь">🇧🇾 Беларусь</option>
                    <option value="Украина">🇺🇦 Украина</option>
                    <option value="Казахстан">🇰🇿 Казахстан</option>
                    <option value="Грузия">🇬🇪 Грузия</option>
                    <option value="Армения">🇦🇲 Армения</option>
                    <option value="Азербайджан">🇦🇿 Азербайджан</option>
                    <option value="Узбекистан">🇺🇿 Узбекистан</option>
                    <option value="Германия">🇩🇪 Германия</option>
                    <option value="Нидерланды">🇳🇱 Нидерланды</option>
                    <option value="Великобритания">🇬🇧 Великобритания</option>
                    <option value="Франция">🇫🇷 Франция</option>
                    <option value="США">🇺🇸 США</option>
                    <option value="Китай">🇨🇳 Китай</option>
                    <option value="Япония">🇯🇵 Япония</option>
                </select>
            </div>

            <!-- === РЕГИОН (только для России) === -->
            <div class="form-group" id="regionGroup">
                <label>Регион</label>
                <select id="srvRegion" onchange="updateCityByRegion()">
                    <option value="">— Не указан —</option>
                    <option value="Центральный">Центральный</option>
                    <option value="Северо-Западный">Северо-Западный</option>
                    <option value="Южный">Южный</option>
                    <option value="Северо-Кавказский">Северо-Кавказский</option>
                    <option value="Приволжский">Приволжский</option>
                    <option value="Уральский">Уральский</option>
                    <option value="Сибирский">Сибирский</option>
                    <option value="Дальневосточный">Дальневосточный</option>
                </select>
            </div>

            <!-- === ГОРОД (заполняется JS) === -->
            <div class="form-group">
                <label>Город</label>
                <select id="srvCity">
                    <option value="">— Не указан —</option>
                </select>
            </div>

            <div class="error" id="serverError"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeServerModal()">Отмена</button>
                <button class="btn-save" onclick="saveServer()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- === БЛОК 7: ПОДКЛЮЧЕНИЕ БИБЛИОТЕК И СКРИПТОВ === -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="/static/app.js"></script>

</body>
</html>
