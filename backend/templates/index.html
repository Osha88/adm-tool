<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Админ-тул</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .header {
            color: #00ff00;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls select,
        .controls input,
        .controls button {
            padding: 8px 16px;
            background: #2a2a2a;
            color: #00ff00;
            border: 1px solid #00ff00;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .controls button {
            cursor: pointer;
        }
        .controls button:hover {
            background: #00ff00;
            color: #1e1e1e;
        }
        .status {
            color: #ffaa00;
            font-size: 14px;
        }
        .macros {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .macros button {
            padding: 4px 12px;
            background: #2a2a2a;
            color: #00ff00;
            border: 1px solid #00ff00;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        .macros button:hover {
            background: #00ff00;
            color: #1e1e1e;
        }
        .console-wrapper {
            width: 95%;
            max-width: 1400px;
            height: 70vh;
            background: black;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            padding: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #output {
            flex: 1;
            color: #00ff00;
            font-size: 14px;
            white-space: pre;
            overflow: auto;
            padding: 8px;
            background: black;
            border: none;
            resize: none;
            font-family: 'Courier New', monospace;
        }
        #input-line {
            display: flex;
            gap: 8px;
            padding: 8px 0;
            border-top: 1px solid #333;
        }
        #prompt {
            color: #00ff00;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        #cmdInput {
            flex: 1;
            background: #1e1e1e;
            color: #00ff00;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <div class="header">🚀 Админ-тул</div>
    <div class="controls">
        <select id="deviceSelect"></select>
        <input type="password" id="passwordInput" placeholder="Пароль SSH" />
        <button onclick="switchDevice()">Подключиться</button>
        <span class="status" id="sshStatus">Статус: не подключено</span>
    </div>

    <div class="macros">
        <button onclick="runMacro('uptime && df -h && free -m')">📊 Статус</button>
        <button onclick="runMacro('ip route && ping -c 2 8.8.8.8')">🌐 Сеть</button>
        <button onclick="runMacro('ls -la /var/log | tail -10')">📁 Логи</button>
        <button onclick="runMacro('systemctl restart apache2')" style="color:#ff4444; border-color:#ff4444;">🔄 Перезагрузить Apache</button>
        <button onclick="visualizeRoute()" style="color:#00ffff; border-color:#00ffff;">🗺️ Визуализировать маршрут</button>
    </div>

    <div class="console-wrapper">
        <pre id="output">Ожидание подключения...</pre>
        <div id="input-line">
            <span id="prompt">&gt; </span>
            <input type="text" id="cmdInput" autofocus />
        </div>
    </div>

    <script>
        let devices = [];
        let ws = null;
        let history = [];
        let historyIndex = -1;
        const output = document.getElementById('output');
        const cmdInput = document.getElementById('cmdInput');

        function loadHistory() {
            const saved = localStorage.getItem('cmd_history');
            if (saved) {
                try {
                    history = JSON.parse(saved);
                    if (!Array.isArray(history)) history = [];
                } catch {
                    history = [];
                }
            }
            if (history.length > 0) {
                print('📜 Загружено ' + history.length + ' команд из истории');
            }
        }

        function saveHistory() {
            try {
                localStorage.setItem('cmd_history', JSON.stringify(history));
            } catch (e) {}
        }

        function print(text) {
            output.textContent += text + '\n';
            output.scrollTop = output.scrollHeight;
        }

        fetch('/api/devices')
            .then(r => r.json())
            .then(data => {
                devices = data;
                const sel = document.getElementById('deviceSelect');
                devices.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name + ' (' + d.host + ')';
                    sel.appendChild(opt);
                });
                print('✅ Устройства загружены');
                loadHistory();
            })
            .catch(() => print('❌ Ошибка загрузки'));

        function switchDevice() {
            const id = document.getElementById('deviceSelect').value;
            const device = devices.find(d => d.id === id);
            if (!device) return;

            const pass = document.getElementById('passwordInput').value.trim();
            if (!pass) {
                alert('Введите пароль');
                return;
            }

            document.getElementById('sshStatus').textContent = '⏳ Подключение...';
            if (ws) ws.close();

            ws = new WebSocket('ws://localhost:8000/ws?device=' + id);
            ws.onopen = () => {
                ws.send(pass);
                document.getElementById('sshStatus').textContent = '✅ ' + device.name;
                output.textContent = '';
                historyIndex = -1;
                print('=== ' + device.name + ' ===');
                print('Введите команду:');
                cmdInput.disabled = false;
                cmdInput.focus();
            };
            ws.onmessage = (e) => {
                const data = e.data;
                if (data === "__AUTH_FAILED__") {
                    document.getElementById('sshStatus').textContent = '❌ Неверный пароль';
                    print('❌ Ошибка: неверный пароль');
                    return;
                }
                if (window._visualize && data.includes('ms')) {
                    window._visualize = false;
                    visualizeTraceroute(data);
                    return;
                }
                print(data);
            };
            ws.onclose = () => {
                if (!document.getElementById('sshStatus').textContent.includes('Подключение')) {
                    document.getElementById('sshStatus').textContent = '❌ Отключено';
                    cmdInput.disabled = true;
                }
            };
        }

        function runMacro(command) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                print('❌ Нет подключения к серверу');
                return;
            }
            print('⚡ ' + command);
            ws.send(command);
            history.push(command);
            if (history.length > 100) history.shift();
            saveHistory();
            historyIndex = -1;
        }

        const COMMANDS = [
            'ls', 'ls -la', 'ls -la /var/log',
            'cd', 'cd /', 'cd /root', 'cd /etc',
            'pwd', 'whoami', 'uptime', 'date',
            'df -h', 'free -m', 'ps aux', 'top',
            'ip addr', 'ip route', 'ping 8.8.8.8', 'traceroute google.com',
            'systemctl status apache2', 'systemctl restart apache2', 'systemctl status ssh',
            'apt update', 'apt upgrade', 'apt install',
            'cat /etc/os-release', 'uname -a', 'hostname'
        ];

        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const current = cmdInput.value;
                if (!current.trim()) {
                    cmdInput.value = COMMANDS[0];
                    return;
                }
                const matches = COMMANDS.filter(cmd => cmd.startsWith(current));
                if (matches.length === 1) {
                    cmdInput.value = matches[0];
                } else if (matches.length > 1) {
                    print('Варианты: ' + matches.join(', '));
                    let prefix = matches[0];
                    for (let i = 1; i < matches.length; i++) {
                        let j = 0;
                        while (j < prefix.length && j < matches[i].length && prefix[j] === matches[i][j]) j++;
                        prefix = prefix.slice(0, j);
                    }
                    if (prefix.length > current.length) {
                        cmdInput.value = prefix;
                    }
                }
                cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length);
            }

            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (!history.length) return;
                if (historyIndex > 0) historyIndex--;
                else if (historyIndex === -1) historyIndex = history.length - 1;
                cmdInput.value = history[historyIndex] || '';
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (!history.length) return;
                if (historyIndex < history.length - 1) historyIndex++;
                else if (historyIndex === history.length - 1) {
                    historyIndex = -1;
                    cmdInput.value = '';
                    return;
                }
                cmdInput.value = history[historyIndex] || '';
            }

            if (e.key === 'Enter') {
                const cmd = cmdInput.value.trim();
                if (!cmd) return;
                history.push(cmd);
                if (history.length > 100) history.shift();
                saveHistory();
                historyIndex = -1;
                print('> ' + cmd);
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(cmd);
                } else {
                    print('❌ Нет подключения');
                }
                cmdInput.value = '';
            }
        });

        function visualizeRoute() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                print('❌ Нет подключения к серверу');
                return;
            }
            print('⏳ Запрос маршрута до 8.8.8.8...');
            window._visualize = true;
            ws.send('traceroute -n 8.8.8.8');
        }

        function visualizeTraceroute(output) {
            const lines = output.split('\n').filter(line => line.trim());
            const hops = [];
            let maxTime = 0;

            lines.forEach(line => {
                const parts = line.trim().split(/\s+/);
                if (parts.length >= 4 && !isNaN(parts[0])) {
                    const hop = {
                        num: parseInt(parts[0]),
                        ip: parts[1] || '*',
                        time: parseFloat(parts[2]) || 0
                    };
                    if (hop.time > maxTime) maxTime = hop.time;
                    hops.push(hop);
                }
            });

            if (hops.length === 0) {
                print('❌ Не удалось распарсить маршрут');
                return;
            }

            print('╔═══════════════════════════════════════════════════════════╗');
            print('║                   🗺️ МАРШРУТ ДО 8.8.8.8                 ║');
            print('╚═══════════════════════════════════════════════════════════╝');

            hops.forEach(hop => {
                const delay = hop.time > 0 ? hop.time.toFixed(1) : '❌';
                const barLength = Math.floor((hop.time / (maxTime || 1)) * 20);
                const bar = '█'.repeat(Math.min(barLength, 20));

                let color = '🟢';
                if (hop.time > 100) color = '🟡';
                if (hop.time > 500 || hop.time === 0) color = '🔴';

                const line = `${color} Хоп ${String(hop.num).padStart(2)}: ${hop.ip.padEnd(15)} → ${String(delay).padStart(6)} мс ${bar}`;
                print(line);
            });

            print('╔═══════════════════════════════════════════════════════════╗');
            print('🟢 < 100 мс  🟡 100-500 мс  🔴 > 500 мс или таймаут');
            print('╚═══════════════════════════════════════════════════════════╝');
        }

        window.switchDevice = switchDevice;
        window.visualizeRoute = visualizeRoute;
    </script>
</body>
</html>
